name: pb-validate

# Checks the brain pages each push to docs/brain and each PR changes (review PRs towards docs/brain, the
# brain PR from docs/brain to {{default_branch}}). It runs on every PR and passes when no page changed, so
# `validate` and `brain-only` can be required checks on {{default_branch}}.
on:
  push:
    branches: ["docs/brain"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the base branch toolkit (a PR cannot change the check that judges it)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .pb-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the changed pages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          pages=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- 'brain/*.md' | grep -v -E '^brain/(index|glossary)\.md$|^brain/context/' || true)
          if [ -z "$pages" ]; then
            echo "No brain page changed."
            exit 0
          fi
          toolkit=.pb-base/brain/.pb/toolkit/pb.py
          # Pushes, and the PR that introduces the brain, use the toolkit of the checked-out branch.
          [ -f "$toolkit" ] || toolkit=brain/.pb/toolkit/pb.py
          echo "$pages" | tr '\n' '\0' | xargs -0 python3 "$toolkit" --brain brain validate

  brain-only:
    # The brain PR carries the brain to the code: it must not carry code.
    runs-on: ubuntu-latest
    steps:
      - name: Only brain/ changes in the PR from docs/brain
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/brain' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # Besides brain/, only what pb itself writes (the first PR, from /pb:init, brings these too).
          outside=$(printf '%s\n' "$files" | grep -v -E '^(brain/|\.github/workflows/pb-[a-z-]+\.yml$|CLAUDE\.md$|\.gitignore$|\.claude/settings\.json$)' || true)
          if [ -n "$outside" ]; then
            echo "docs/brain carries changes outside brain/. Move them to a code PR and remove them from docs/brain:"
            echo "$outside"
            exit 1
          fi
