name: pb-generate

# Regenerates index, glossary, context packs and backlinks on docs/brain after each save.
on:
  push:
    branches: ["docs/brain"]
    paths:
      - "brain/**"
      - "!brain/index.md"
      - "!brain/glossary.md"
      - "!brain/context/**"
      - "!brain/.pb/backlinks.json"
  workflow_dispatch:

concurrency:
  group: pb-docs-brain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/brain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate index, glossary, context packs, backlinks
        run: python3 brain/.pb/toolkit/pb.py generate
      - name: Commit generated files
        run: |
          if [ -n "$(git status --porcelain brain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brain
            git commit -m "pb(generate): refresh generated files [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin docs/brain && git push origin HEAD:docs/brain && exit 0
              sleep 5
            done
            exit 1
          fi
