name: pb-generate

# Merges done by GitHub auto-merge (GITHUB_TOKEN) do not trigger push workflows,
# so the schedule catches up on them; workflow_dispatch allows a manual refresh.
on:
  push:
    branches: ["{{default_branch}}"]
    paths:
      - "brain/**"
      - "!brain/index.md"
      - "!brain/glossary.md"
      - "!brain/context/**"
      - "!brain/.pb/backlinks.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: pb-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "{{default_branch}}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate index, glossary, context packs, backlinks
        run: python3 brain/.pb/toolkit/pb.py generate
      - name: Commit generated files
        run: |
          if [ -n "$(git status --porcelain brain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brain
            git commit -m "pb(generate): refresh generated files [skip ci]"
            git pull --rebase origin "{{default_branch}}"
            git push origin HEAD:"{{default_branch}}"
          fi
