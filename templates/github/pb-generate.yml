name: pb-generate

on:
  push:
    branches: ["{{default_branch}}"]
    paths:
      - "brain/**"
      - "!brain/index.md"
      - "!brain/glossary.md"
      - "!brain/context/**"
      - "!brain/.pb/backlinks.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate index, glossary, context packs, backlinks
        run: python3 brain/.pb/toolkit/pb.py generate
      - name: Commit generated files
        run: |
          if [ -n "$(git status --porcelain brain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brain
            git commit -m "pb(generate): refresh generated files [skip ci]"
            git push
          fi
