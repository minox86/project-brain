name: pb-validate

# Checks the brain pages each pull request changes: validity and freshness of the generated files (job
# `validate`), and an informational `review` of watched points. It runs on every PR and passes when no brain
# page changed, so `validate` and `brain-only` can be required checks on {{default_branch}}. Nothing here
# merges or pushes.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the base branch toolkit (a PR cannot change the check that judges it)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .pb-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the changed pages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pages=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- 'brain/*.md' | grep -v -E '^brain/(index|glossary|features)\.md$|^brain/context/' || true)
          if [ -z "$pages" ]; then
            echo "No brain page changed."
            exit 0
          fi
          toolkit=.pb-base/brain/.pb/toolkit/pb.py
          # The PR that introduces the brain has no toolkit on the base branch: use the PR's own.
          [ -f "$toolkit" ] || toolkit=brain/.pb/toolkit/pb.py
          echo "$pages" | tr '\n' '\0' | xargs -0 python3 -B "$toolkit" --brain brain validate
      - name: Generated files are fresh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The checkout is the merge result of the PR and its base.
          if git diff --quiet "$BASE"...HEAD -- brain; then
            echo "No file under brain/ changed."
            exit 0
          fi
          toolkit=.pb-base/brain/.pb/toolkit/pb.py
          [ -f "$toolkit" ] || toolkit=brain/.pb/toolkit/pb.py
          # A PR that changes the vendored toolkit (an upgrade) commits files made by the new generator:
          # judge them with it, or the upgrade PR itself would fail.
          if ! git diff --quiet "$BASE"...HEAD -- brain/.pb/toolkit; then
            toolkit=brain/.pb/toolkit/pb.py
          fi
          python3 -B "$toolkit" --brain brain generate
          if [ -n "$(git status --porcelain -- brain)" ]; then
            git status --short -- brain
            echo 'Generated files are stale: run `PB generate` and commit'
            exit 1
          fi

  review:
    # Informs, never blocks: the repo's own branch protection decides what a review is worth.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the base branch toolkit (a PR cannot change the check that judges it)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .pb-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Watched points and reviewers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if git diff --quiet "$BASE"...HEAD -- brain; then
            echo "No file under brain/ changed."
            exit 0
          fi
          toolkit=.pb-base/brain/.pb/toolkit/pb.py
          [ -f "$toolkit" ] || toolkit=brain/.pb/toolkit/pb.py
          python3 -B "$toolkit" --brain brain review --base "$BASE" --no-noise > "$RUNNER_TEMP/review.json" || {
            echo "::warning::The review could not be evaluated."
            exit 0
          }
          touched=$(git diff --name-only "$BASE"...HEAD -- brain/schema brain/.pb/toolkit)
          {
            jq -r '.markdown' "$RUNNER_TEMP/review.json"
            if [ -n "$touched" ]; then
              echo
              echo "### Schema or toolkit changed"
              printf '%s\n' "$touched" | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          args=()
          # GitHub refuses the whole request when the PR's author is listed.
          for user in $(jq -r '.reviewers.users[]' "$RUNNER_TEMP/review.json"); do
            [ "${user,,}" = "${AUTHOR,,}" ] && continue
            args+=(-f "reviewers[]=$user")
          done
          for team in $(jq -r '.reviewers.teams[]' "$RUNNER_TEMP/review.json"); do args+=(-f "team_reviewers[]=$team"); done
          if [ "${#args[@]}" -gt 0 ]; then
            gh api -X POST "repos/$REPO/pulls/$NUMBER/requested_reviewers" "${args[@]}" > /dev/null \
              || echo "::warning::Could not request the reviewers (a fork PR or a missing permission); the review is in the job summary."
          fi

  brain-only:
    # The brain PR carries the brain to the code: it must not carry code.
    runs-on: ubuntu-latest
    steps:
      - name: Only brain/ changes in the PR from docs/brain
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/brain' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # Nothing but brain/: /pb:init brings its files on pb/init, and /pb:merge alerts on anything else.
          outside=$(printf '%s\n' "$files" | grep -v -E '^brain/' || true)
          if [ -n "$outside" ]; then
            echo "docs/brain carries changes outside brain/. Move them to a code PR and remove them from docs/brain:"
            echo "$outside"
            exit 1
          fi
